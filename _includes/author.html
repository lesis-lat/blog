{%- assign author_bio = include.author.bio[current_lang] | default: include.author.bio.en -%}
<div class="about-author">
  <div class="author-image-block">
    <img class="author-image" src="{{ '/assets/authors/' | append: include.author.image | relative_url }}" alt="" width="88" height="88" loading="lazy" decoding="async">
  </div>
  <div class="author-info-block">
    <p class="author-name">
      {% include icon.html name="linkedin" %}
      <a href="{{ include.author.url }}" rel="noopener noreferrer">{{ include.author.name | escape }}</a>
    </p>
    <p class="author-description">{{ author_bio | escape }}</p>
  </div>
</div>
