---
permalink: /404.html
layout: default
title: "404"
---
{% include i18n.html %}
<div class="not-found">
  <h1>404</h1>
  {%- for language in site.data.translations %}
  <div lang="{{ language[1].html_lang }}" data-not-found-lang="{{ language[0] }}"{% if language[0] != current_lang %} hidden{% endif %}>
    <p><strong>{{ language[1].not_found_title }}</strong></p>
    <p>{{ language[1].not_found_text }}</p>
  </div>
  {%- endfor %}
</div>
<script type="application/json" id="not-found-redirects">[
{%- for post in site.posts -%}
  {%- assign yyyy = post.date | date: "%Y" -%}
  {%- assign mm = post.date | date: "%m" -%}
  {%- assign dd = post.date | date: "%d" -%}
  {%- assign slug_normalized = post.slug -%}
  {%- assign lang_prefix = "" -%}
  {%- if post.lang != "pt" -%}
    {%- assign lang_prefix = "/" | append: post.lang -%}
    {%- assign lang_suffix = "-" | append: post.lang -%}
    {%- assign cut = post.slug.size | minus: 3 -%}
    {%- assign tail = post.slug | slice: cut, 3 -%}
    {%- if tail == lang_suffix -%}
      {%- assign slug_normalized = post.slug | slice: 0, cut -%}
    {%- endif -%}
  {%- endif -%}
  {%- assign date_path = "/" | append: yyyy | append: "/" | append: mm | append: "/" | append: dd | append: "/" -%}
  {%- assign old_style = lang_prefix | append: date_path | append: post.slug | append: "/" -%}
  {%- assign old_style_normalized = lang_prefix | append: date_path | append: slug_normalized | append: "/" -%}
  {%- unless forloop.first -%},{%- endunless -%}
  {"target": {{ post.url | relative_url | jsonify }}, "legacy": [{{ old_style | jsonify }}, {{ old_style_normalized | jsonify }}
  {%- if post.lang != "pt" -%}
    , {{ date_path | append: post.slug | append: "/" | jsonify }}, {{ date_path | append: slug_normalized | append: "/" | jsonify }}
  {%- endif -%}
  ]}
{%- endfor -%}
]</script>
<script src="{{ '/assets/not-found.js' | relative_url }}?v={{ asset_version }}" defer></script>
